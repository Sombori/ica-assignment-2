<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bakery App - 19004293</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <header>
      <div class="location-bar">
        <div class="location-left"><span>📍</span><span>Deliver to Hydepark</span></div>
        <span>▾</span>
      </div>
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="search" placeholder="Search for croissants...">
      </div>
    </header>

    <main>
      <section class="promo-banner">
        <div class="promo-title">20% OFF SPECIAL</div>
        <div class="promo-coupon"><span>🏷</span><span>CODE: BAKE20</span></div>
      </section>

      <section class="categories">
        <div class="category-card"><span class="category-icon">🥐</span><span class="category-title">Pastry</span></div>
        <div class="category-card"><span class="category-icon">🥖</span><span class="category-title">Bread</span></div>
        <div class="category-card"><span class="category-icon">🍰</span><span class="category-title">Cakes</span></div>
        <div class="category-card"><span class="category-icon">☕</span><span class="category-title">Coffee</span></div>
      </section>

      <section class="featured-card">
        <div class="store-cover"></div>
        <div class="store-details">
          <div class="store-header"><span class="store-name">Le Petite Baguette</span><span class="store-rating">★ 5.0</span></div>
          <div class="store-meta">20 min • Cash or Credit</div>
        </div>
      </section>
    </main>

    <nav class="bottom-nav">
      <div class="nav-item">🏠</div>
      <div class="nav-item">🔍</div>
      <div class="nav-item">📋</div>
      <div class="nav-item">👤</div>
    </nav>
  </div>
</body>
</html>
